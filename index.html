<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layout Forge – infinite website layouts</title>
<style>
:root{--bg:#e9edf1;--panel:#fff;--ink:#14202b;--mute:#5d6b78;--line:#cfd7de;--acc:#0b6e6e}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--panel:#18222b;--ink:#e8eef3;--mute:#93a3b1;--line:#2b3946;--acc:#4fd1c5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;height:100vh;display:grid;grid-template-columns:300px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 1.35rem Georgia,serif;margin:0}
label{display:grid;gap:4px;font-weight:600}
input[type=text],select{padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit;font:inherit}
fieldset{border:1px solid var(--line);border-radius:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}
legend{font-weight:600;padding:0 6px}fieldset label{font-weight:400;display:flex;gap:6px}
button{font:inherit;font-weight:600;padding:10px 14px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--panel);cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btns{display:flex;gap:8px}.btns button{flex:1}
main{display:grid;grid-template-rows:auto 1fr;min-width:0}
.bar{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);align-items:center;flex-wrap:wrap}
.tab{background:transparent;color:var(--ink);border-color:transparent}
.tab[aria-selected=true]{border-color:var(--acc);color:var(--acc)}
.bar .sp{flex:1}.bar small{color:var(--mute)}
#view{position:relative;min-height:0}
iframe,pre{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0}
iframe{background:#fff}
pre{overflow:auto;padding:18px;background:var(--panel);font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;tab-size:2}
#status{padding:24px;color:var(--mute)}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto 70vh;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<aside>
  <h1>Layout Forge</h1>
  <p style="margin:0;color:var(--mute)">Generates a new website layout from a seed. Python runs in your browser through WebAssembly.</p>
  <label>What is the site about?<input id="topic" type="text" value="your business"></label>
  <label>Mood
    <select id="mood"><option>any</option><option>clean</option><option>bold</option><option>elegant</option><option>playful</option></select>
  </label>
  <fieldset id="secs"><legend>Sections</legend></fieldset>
  <label style="font-weight:400;display:flex;gap:8px"><input id="js" type="checkbox" checked> Include JavaScript</label>
  <div class="btns"><button id="prev" class="ghost">Back</button><button id="gen" disabled>Generate</button></div>
  <small id="seedinfo" style="color:var(--mute)"></small>
</aside>
<main>
  <div class="bar" role="tablist">
    <button class="tab" role="tab" data-t="preview" aria-selected="true">Preview</button>
    <button class="tab" role="tab" data-t="html">HTML</button>
    <button class="tab" role="tab" data-t="css">CSS</button>
    <button class="tab" role="tab" data-t="js">JS</button>
    <span class="sp"></span>
    <button id="copy" class="ghost">Copy code</button>
    <button id="dl" class="ghost">Download files</button>
  </div>
  <div id="view"><div id="status">Loading Python (WebAssembly)…</div></div>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const SECTIONS=["hero","features","stats","gallery","testimonials","pricing","cta"];
const $=id=>document.getElementById(id);
$("secs").insertAdjacentHTML("beforeend",SECTIONS.map(s=>`<label><input type="checkbox" value="${s}" checked>${s}</label>`).join(""));
let py,gen,history=[],pos=-1,tab="preview";

async function boot(){
  py=await loadPyodide();
  py.runPython(await (await fetch("layout_engine.py")).text());
  gen=py.globals.get("generate");
  $("gen").disabled=false;
  make();
}
function make(seed){
  const secs=[...document.querySelectorAll("#secs input:checked")].map(i=>i.value);
  seed=seed??Math.floor(Math.random()*2**31);
  const out=JSON.parse(gen(seed,$("topic").value,$("mood").value,py.toPy(secs),$("js").checked));
  history=history.slice(0,pos+1);history.push(out);pos=history.length-1;show();
}
function show(){
  const d=history[pos];if(!d)return;
  $("seedinfo").textContent=`Layout ${pos+1} of ${history.length} · seed ${d.seed}`;
  $("prev").disabled=pos<1;
  const v=$("view");
  if(tab==="preview"){v.innerHTML='<iframe title="Preview"></iframe>';v.firstChild.srcdoc=d.preview}
  else{v.innerHTML="<pre></pre>";v.firstChild.textContent=d[tab]||"/* JavaScript is turned off for this layout. */"}
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));show()});
$("gen").onclick=()=>make();
$("prev").onclick=()=>{if(pos>0){pos--;show()}};
$("copy").onclick=async e=>{
  const d=history[pos];if(!d)return;
  await navigator.clipboard.writeText(tab==="preview"?d.preview:d[tab]);
  e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy code",1200)};
$("dl").onclick=()=>{
  const d=history[pos];if(!d)return;
  const files={"index.html":d.html,"style.css":d.css};if(d.js)files["script.js"]=d.js;
  for(const [n,t] of Object.entries(files)){
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download=n;a.click()}};
boot().catch(e=>$("view").innerHTML=`<div id="status">Could not start Python: ${e.message}. Open this page through a web server (GitHub Pages), not as a local file.</div>`);
</script>
</body>
</html>
